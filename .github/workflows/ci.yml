name: Continuous Integration & Automated Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-verification:
    name: Backend Unit, Integration & E2E Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Test Suite (83 Tests)
        run: |
          pytest -v

  frontend-verification:
    name: Frontend Vitest Suite & Production Build (Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Suite (15 Tests)
        working-directory: ./frontend
        run: npm run test

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build
