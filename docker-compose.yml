version: '3.8'

services:
  # =====================================================================
  # FastAPI Agentic AI Backend Service
  # =====================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ipo_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      - DEFAULT_CONNECTOR_MODE=OFFLINE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ipo_network

  # =====================================================================
  # React + TypeScript Production Frontend Service (Nginx)
  # =====================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipo_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - ipo_network

networks:
  ipo_network:
    driver: bridge
